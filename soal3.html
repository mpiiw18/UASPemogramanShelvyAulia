<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perhitungan Biaya Sewa Mobil</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      color: #252525;
      background: #f3f3f3;
      font-family: Arial, Helvetica, sans-serif;
    }
    .calculator {
      width: min(440px, 100%);
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 24px;
    }
    .form-card {
      padding: 26px 24px 22px;
      background: #fff;
      border: 1px solid #e1e1e1;
      border-radius: 12px;
      box-shadow: 0 2px 6px #0000001a;
    }
    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(120px, 1.05fr);
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    label {
      font-size: 14px;
    }
    input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid #d5d5d5;
      border-radius: 7px;
      font: inherit;
    }
    input:focus {
      outline: 2px solid #9cc9fa;
      border-color: #1684e8;
    }
    button {
      display: block;
      min-width: 112px;
      margin: 4px auto 0;
      padding: 10px 16px;
      color: #fff;
      background: #087ff0;
      border: 0;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    button:hover {
      background: #066bd0;
    }

    .results {
      margin-top: 20px;
      text-align: center;
      font-size: 15px;
    }

    .result-line {
      margin: 5px 0;
    }
    .total-pay {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 2px solid #888;
      font-weight: 700;
    }
    @media (max-width: 420px) {
      .form-card { padding: 22px 16px; }
      .field-row { grid-template-columns: 1fr; gap: 7px; }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Perhitungan Biaya Sewa Mobil</h1>
    <form class="form-card" id="rental-form">
      <div class="field-row">
        <label for="tarif">Tarif Sewa per Hari (Rp)</label>
        <input id="tarif" name="tarif" type="number" min="1" step="1" value="500000" required>
      </div>
      <div class="field-row">
        <label for="hari">Jumlah Hari Sewa</label>
        <input id="hari" name="hari" type="number" min="1" step="1" value="2" required>
      </div>
      <button type="button" id="hitung">Hitung Total</button>
    </form>

    <section class="results" id="hasil" aria-live="polite" aria-label="Rincian biaya sewa">
      <p class="result-line"><strong>Total Biaya Sewa: <span id="total-awal">Rp 0</span></strong></p>
      <p class="result-line"><strong>Potongan Diskon (<span id="persen-diskon">0</span>%): <span id="nominal-diskon">Rp 0</span></strong></p>
      <p class="result-line total-pay">Total Bayar: <span id="total-akhir">Rp 0</span></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('rental-form');
    // Format angka menjadi mata uang Rupiah.
    const formatRupiah = new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    });

    function hitungTotal() {
      const tarif = Number(document.getElementById('tarif').value);
      const jumlahHari = Number(document.getElementById('hari').value);
      // Total awal dihitung dari tarif dikali lama sewa.
      const totalAwal = tarif * jumlahHari;
      let persenDiskon = 0;

      if (totalAwal > 3000000) {
        persenDiskon = 10;
      } else if (totalAwal >= 1500000) {
        persenDiskon = 5;
      }

      const nominalDiskon = totalAwal * persenDiskon / 100;
      const totalAkhir = totalAwal - nominalDiskon;

      document.getElementById('total-awal').textContent = formatRupiah.format(totalAwal);
      document.getElementById('persen-diskon').textContent = persenDiskon;
      document.getElementById('nominal-diskon').textContent = formatRupiah.format(nominalDiskon);
      document.getElementById('total-akhir').textContent = formatRupiah.format(totalAkhir);
    }

    document.getElementById('hitung').addEventListener('click', () => {
      if (form.reportValidity()) hitungTotal();
    });

    hitungTotal();
  </script>
</body>
</html>
